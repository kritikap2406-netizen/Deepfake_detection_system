# TrueSight — docker-compose orchestration.
#
# NOTE: written and reviewed for correctness but not run-tested in this
# sandbox (no Docker daemon available). Verify with `docker compose up`
# before relying on it for the SIH demo.
#
# Usage:
#   docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite results and generated heatmaps across container restarts.
      - ./backend/truesight_results.db:/app/backend/truesight_results.db
      - ./backend/static/heatmaps:/app/backend/static/heatmaps
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
