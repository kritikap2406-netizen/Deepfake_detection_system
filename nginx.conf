server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and static-heatmap requests to the backend container
    # (service name "backend", per docker-compose.yml).
    location /analyze/ {
        proxy_pass http://backend:8000;
    }
    location /result/ {
        proxy_pass http://backend:8000;
    }
    location /health {
        proxy_pass http://backend:8000;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }
}
